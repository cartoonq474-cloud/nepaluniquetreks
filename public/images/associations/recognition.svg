<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 92" width="90" height="92">
  <!-- Gold Hexagonal Badge -->
  <polygon points="45,4 84,26 84,66 45,88 6,66 6,26" fill="#F59E0B" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Inner Hexagon Frame -->
  <polygon points="45,8 80,28 80,64 45,84 10,64 10,28" fill="#FBBF24" stroke="#D97706" stroke-width="1.2"/>
  <!-- Center White Globe / Compass Motif -->
  <circle cx="45" cy="40" r="17" fill="#FFFFFF" stroke="#92400E" stroke-width="1.8"/>
  <!-- Latitude & Longitude Lines -->
  <ellipse cx="45" cy="40" rx="9" ry="17" fill="none" stroke="#D97706" stroke-width="1"/>
  <line x1="28" y1="40" x2="62" y2="40" stroke="#D97706" stroke-width="1"/>
  <line x1="31" y1="31" x2="59" y2="31" stroke="#D97706" stroke-width="0.8"/>
  <line x1="31" y1="49" x2="59" y2="49" stroke="#D97706" stroke-width="0.8"/>
  <!-- Compass pointer in center -->
  <polygon points="45,27 49,40 45,43 41,40" fill="#B45309"/>
  <!-- Banner / Text -->
  <rect x="18" y="62" width="54" height="15" rx="3" fill="#78350F"/>
  <text x="45" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MEMBER</text>
  <text x="45" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.5" font-weight="800" fill="#78350F" text-anchor="middle" letter-spacing="0.5">ATTA</text>
</svg>