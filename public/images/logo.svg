<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 68" width="316" height="68" aria-label="Nepal Unique Treks &amp; Expeditions Logo">
  <defs>
    <!-- Sunrise Golden Gradient -->
    <linearGradient id="nutSunC" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E67E22" />
      <stop offset="100%" stop-color="#F2A623" />
    </linearGradient>
    <radialGradient id="nutGlowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2A623" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F2A623" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ==================== EMBLEM (Left: x=2 to x=68) ==================== -->
  <g transform="translate(2, 2)">
    <!-- Sunrise Ambient Halo & Disc -->
    <circle cx="36" cy="18" r="16" fill="url(#nutGlowC)" />
    <circle cx="36" cy="18" r="11" fill="url(#nutSunC)" />

    <!-- Background Mountain Ridge (Right Peak) -->
    <polygon points="50,18 66,54 34,54" fill="#176B4B" opacity="0.45" />

    <!-- Main Majestic Himalayan Peak (Center Apex at 28, 8) -->
    <!-- Left Face: Alpine Forest Green -->
    <polygon points="28,8 26,32 24,54 4,54" fill="#12543B" />
    <!-- Right Shaded Face: Deep Shadow Forest Green -->
    <polygon points="28,8 54,54 24,54 26,32" fill="#0B2C1F" />

    <!-- Secondary Foreground Ridge (Apex at 42, 24) -->
    <polygon points="42,24 62,54 28,54" fill="#176B4B" />
    <polygon points="42,24 62,54 42,54" fill="#0B2C1F" opacity="0.85" />

    <!-- Crystalline Alpine White Snow Caps -->
    <polygon points="28,8 35,21 31,19 28,25 24,20 20,23 16,21" fill="#FFFFFF" />
    <polygon points="42,24 47,33 44,32 42,35 38,32 36,33" fill="#FFFFFF" />

    <!-- Trekker Silhouette Ascending the Slope -->
    <g transform="translate(13, 27) scale(0.72)" fill="#FFFFFF">
      <!-- Head with Beanie/Cap -->
      <circle cx="11.5" cy="4.5" r="2.8" />
      <path d="M12 3.5 L15.5 4.5 L12.5 5 Z" />
      <!-- Backpack -->
      <ellipse cx="6" cy="11" rx="3.2" ry="5" transform="rotate(-18 6 11)" />
      <!-- Torso Leaning into the Ascent -->
      <path d="M7 7 L12 9 L10 17 L6 15 Z" />
      <!-- Forward Bent Climbing Leg -->
      <path d="M10 16 L14 19 L15 25 L13 25.5 L12 21 L8.5 17 Z" />
      <!-- Trailing Push-off Leg -->
      <path d="M7 15 L5 20 L2 24 L0.5 23 L3.5 19 L6 14 Z" />
      <!-- Arm & Trekking Pole -->
      <path d="M9 9 L13 14 L12 15 Z" />
      <line x1="13" y1="13" x2="16.5" y2="26" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" />
    </g>

    <!-- Base Horizon Line in Signature Sunrise Amber -->
    <line x1="2" y1="56" x2="66" y2="56" stroke="#E9A544" stroke-width="2.6" stroke-linecap="round" />
  </g>

  <!-- ==================== TYPOGRAPHY (Right: x=78) ==================== -->
  <g transform="translate(78, 0)">
    <!-- Primary Title: NEPAL UNIQUE -->
    <text x="0" y="34" fill="#12543B" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23.5" font-weight="900" letter-spacing="1.8">NEPAL UNIQUE</text>
    <!-- Secondary Subtitle: TREKS & EXPEDITIONS -->
    <text x="1" y="52" fill="#D97706" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="700" letter-spacing="4.5">TREKS &amp; EXPEDITIONS</text>
  </g>
</svg>
